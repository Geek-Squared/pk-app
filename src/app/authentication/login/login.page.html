<ion-content class="login-content">
  <div class="login-bg">
    <img src="/assets/images/logo.png" alt="Positive Konnections" />
  </div>

  <div class="login-wrapper">
    <div class="brand">
      <div class="logo-badge">PK</div>
      <div class="brand-name">Positive Konnections</div>
    </div>

    <ion-card>
      <ion-card-content>
        <h2>Welcome</h2>
        <p>Enter your details to access your account</p>

        <form class="pk-form">
          <div class="pk-field">
            <label for="login-email">Email</label>
            <div class="pk-input-group">
              <ion-icon name="mail-outline" aria-hidden="true"></ion-icon>
              <input
                id="login-email"
                class="pk-input"
                type="email"
                #email
                required
                autocomplete="email"
                inputmode="email"
                placeholder="your@email.com"
              />
            </div>
          </div>

          <div class="pk-field">
            <label for="login-password">Password</label>
            <div class="pk-input-group">
              <ion-icon name="lock-closed-outline" aria-hidden="true"></ion-icon>
              <input
                id="login-password"
                class="pk-input"
                type="password"
                #password
                required
                autocomplete="current-password"
                placeholder="Your password"
              />
            </div>
          </div>

          <ion-button
            type="submit"
            (click)="logIn(email, password)"
            expand="block"
            class="btn-primary"
            >Login with Email</ion-button
          >

          <div class="divider">
            <span>or</span>
          </div>

          <ion-button
            type="submit"
            (click)="logIn(email, password)"
            expand="block"
            fill="outline"
            class="btn-google"
          >
            <ion-icon name="logo-google" slot="start" aria-hidden="true"></ion-icon>
            Login with Google</ion-button
          >
        </form>
      </ion-card-content>
    </ion-card>

    <p class="ion-text-center register-text">
      <a routerLink="/registration">Register</a>
      <span class="dot">·</span>
      <a routerLink="/reset-password">Reset password</a>
    </p>
  </div>
</ion-content>

<ion-content class="login-content">
  <div class="login-bg">
    <img src="/assets/images/logo.png" alt="Positive Konnections" />
  </div>

  <div class="login-wrapper">
    <div class="brand">
      <div class="logo-badge">PK</div>
      <div class="brand-name">Positive Konnections</div>
    </div>

    <ion-card>
      <ion-card-content>
        <h2>Welcome</h2>
        <p>Enter your details to access your account</p>

        <form>
          <div class="field">
            <ion-item lines="none">
              <ion-icon name="mail-outline" slot="start" aria-hidden="true"></ion-icon>
              <ion-input
                type="text"
                #email
                required
                placeholder="your@email.com"
              ></ion-input>
            </ion-item>
          </div>

          <div class="field">
            <ion-item lines="none">
              <ion-icon name="lock-closed-outline" slot="start" aria-hidden="true"></ion-icon>
              <ion-input
                type="password"
                #password
                required
                placeholder="password"
              ></ion-input>
            </ion-item>
          </div>

          <ion-button
            type="submit"
            (click)="logIn(email, password)"
            expand="block"
            class="btn-primary"
            >Login with Email</ion-button
          >

          <div class="divider">
            <span>or</span>
          </div>

          <ion-button
            type="submit"
            (click)="logIn(email, password)"
            expand="block"
            fill="outline"
            class="btn-google"
          >
            <ion-icon name="logo-google" slot="start" aria-hidden="true"></ion-icon>
            Login with Google</ion-button
          >
        </form>
      </ion-card-content>
    </ion-card>

    <p class="ion-text-center register-text">
      <a routerLink="/registration">Register</a>
      <span class="dot">·</span>
      <a routerLink="/reset-password">Reset password</a>
    </p>
  </div>
</ion-content>

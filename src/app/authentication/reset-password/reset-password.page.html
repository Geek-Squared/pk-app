<ion-content class="reset-content">
  <div class="auth-wrapper">
    <div class="auth-hero">
      <div class="hero-icon">
        <ion-icon name="lock-closed-outline"></ion-icon>
      </div>
      <h1>Forgot password?</h1>
      <p>Enter your email below to reset account</p>
    </div>

    <ion-card>
      <ion-card-content>
        <p class="card-hint">
          We'll send a reset link to your email so you can get back into your account.
        </p>
        <form class="pk-form">
          <div class="pk-field">
            <label for="reset-email">Email</label>
            <div class="pk-input-group">
              <ion-icon name="mail-outline" aria-hidden="true"></ion-icon>
              <input id="reset-email" class="pk-input" type="email" #email required
                     autocomplete="email" inputmode="email" placeholder="your@email.com" />
            </div>
          </div>

          <ion-button
            type="submit"
            expand="block"
            (click)="resetPassword(email)"
            class="btn-primary"
            >Reset</ion-button
          >
        </form>
      </ion-card-content>
    </ion-card>

    <p class="alt-link">
      <a routerLink="/login">← Back to login</a>
    </p>
  </div>
</ion-content>

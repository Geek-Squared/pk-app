<ion-content class="register-content">
  <div class="auth-wrapper">
    <div class="auth-hero">
      <div class="hero-icon">
        <ion-icon name="person-add-outline"></ion-icon>
      </div>
      <h1>Create account</h1>
      <p>Enter your details below to register</p>
    </div>

    <ion-card>
      <ion-card-content>
        <form>
          <div class="field">
            <p class="field-label">Display Name</p>
            <ion-item lines="none">
              <ion-icon name="person-outline" slot="start" aria-hidden="true"></ion-icon>
              <ion-input type="text" #name required placeholder="Jane Doe"></ion-input>
            </ion-item>
          </div>

          <div class="field">
            <p class="field-label">Email</p>
            <ion-item lines="none">
              <ion-icon name="mail-outline" slot="start" aria-hidden="true"></ion-icon>
              <ion-input type="email" #email required placeholder="your@email.com"></ion-input>
            </ion-item>
          </div>

          <div class="field">
            <p class="field-label">Password</p>
            <ion-item lines="none">
              <ion-icon name="lock-closed-outline" slot="start" aria-hidden="true"></ion-icon>
              <ion-input type="password" #password required placeholder="password"></ion-input>
            </ion-item>
          </div>

          <div class="consent-row">
            <ion-checkbox
              [checked]="agreedToTerms"
              (ionChange)="agreedToTerms = $event.detail.checked"
              aria-label="Agree to terms"
            ></ion-checkbox>
            <span class="consent-text">
              I agree to the
              <a routerLink="/terms-conditions">Terms &amp; Conditions</a>
              and
              <a routerLink="/privacy-policy">Privacy Policy</a>, and I consent to the
              processing of my health-related information as described.
            </span>
          </div>

          <ion-button
            type="submit"
            (click)="signUp(email, password, name)"
            expand="block"
            class="btn-primary"
            [disabled]="!agreedToTerms"
            >Register</ion-button
          >
        </form>
      </ion-card-content>
    </ion-card>

    <p class="alt-link">
      Already have an account? <a routerLink="/login">Login</a>
    </p>
  </div>
</ion-content>

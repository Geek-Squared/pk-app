<ion-content class="register-content">
  <div class="auth-wrapper">
    <div class="auth-hero">
      <div class="hero-icon">
        <ion-icon name="person-add-outline"></ion-icon>
      </div>
      <h1>Create account</h1>
      <p>Enter your details below to register</p>
    </div>

    <ion-card>
      <ion-card-content>
        <form class="pk-form">
          <div class="pk-field">
            <label for="reg-name">Display Name</label>
            <div class="pk-input-group">
              <ion-icon name="person-outline" aria-hidden="true"></ion-icon>
              <input id="reg-name" class="pk-input" type="text" #name required autocomplete="name" placeholder="Jane Doe" />
            </div>
          </div>

          <div class="pk-field">
            <label for="reg-email">Email</label>
            <div class="pk-input-group">
              <ion-icon name="mail-outline" aria-hidden="true"></ion-icon>
              <input id="reg-email" class="pk-input" type="email" #email required autocomplete="email" placeholder="your@email.com" />
            </div>
          </div>

          <div class="pk-field">
            <label for="reg-password">Password</label>
            <div class="pk-input-group">
              <ion-icon name="lock-closed-outline" aria-hidden="true"></ion-icon>
              <input id="reg-password" class="pk-input" type="password" #password required autocomplete="new-password" placeholder="At least 8 characters" />
            </div>
          </div>

          <div class="consent-row">
            <ion-checkbox
              [checked]="agreedToTerms"
              (ionChange)="agreedToTerms = $event.detail.checked"
              aria-label="Agree to terms"
            ></ion-checkbox>
            <span class="consent-text">
              I agree to the
              <a routerLink="/terms-conditions">Terms &amp; Conditions</a>
              and
              <a routerLink="/privacy-policy">Privacy Policy</a>, and I consent to the
              processing of my health-related information as described.
            </span>
          </div>

          <ion-button
            type="submit"
            (click)="signUp(email, password, name)"
            expand="block"
            class="btn-primary"
            [disabled]="!agreedToTerms"
            >Register</ion-button
          >
        </form>
      </ion-card-content>
    </ion-card>

    <p class="alt-link">
      Already have an account? <a routerLink="/login">Login</a>
    </p>
  </div>
</ion-content>

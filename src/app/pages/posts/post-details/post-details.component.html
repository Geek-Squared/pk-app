<ion-content [fullscreen]="true" class="post-detail-content">
  <div class="pd-wrap">

    <!-- Header -->
    <div class="pd-head">
      <span class="overline">Story</span>
      <button class="close-btn" (click)="dismiss()" aria-label="Close">
        <ion-icon name="close"></ion-icon>
      </button>
    </div>

    <!-- Hero media -->
    <div class="media" [class.is-playing]="playingVideo">
      <ng-container *ngIf="!playingVideo">
        <img *ngIf="story?.imageUrl" [src]="story?.imageUrl" class="media-thumb" alt="" />
        <div class="media-empty" *ngIf="!story?.imageUrl">
          <ion-icon name="image-outline"></ion-icon>
        </div>
        <div class="media-overlay"></div>

        <span class="media-badge" *ngIf="hasVideo">
          <ion-icon name="play"></ion-icon> Video
        </span>
        <button class="media-play" *ngIf="hasVideo" (click)="playVideo()" aria-label="Play video">
          <ion-icon name="play"></ion-icon>
        </button>
      </ng-container>

      <!-- Inline players -->
      <iframe
        *ngIf="playingVideo && videoKind === 'youtube'"
        [src]="videoEmbedUrl"
        class="media-frame"
        frameborder="0"
        allow="autoplay; encrypted-media; picture-in-picture"
        allowfullscreen
      ></iframe>
      <video
        *ngIf="playingVideo && videoKind === 'file'"
        [src]="directVideoUrl"
        class="media-frame"
        controls
        autoplay
        playsinline
      ></video>
    </div>

    <!-- Title -->
    <h1 class="pd-title">{{ story?.title }}</h1>

    <!-- Description -->
    <p class="pd-desc" *ngIf="story?.description">{{ story?.description }}</p>

    <!-- Audio player -->
    <div class="audio-card" *ngIf="story?.audio">
      <button class="audio-play" (click)="toggleAudio()" aria-label="Play audio">
        <ion-icon [name]="audioPlaying ? 'pause' : 'play'"></ion-icon>
      </button>
      <div class="wave">
        <i *ngFor="let b of waveBars" [style.height.%]="b"></i>
      </div>
      <span class="audio-time">{{ audioPlaying ? audioCurrent : audioDuration }}</span>
      <audio
        #audioEl
        [src]="story?.audio"
        preload="metadata"
        (timeupdate)="onAudioTime()"
        (loadedmetadata)="onAudioMeta()"
        (ended)="onAudioEnded()"
      ></audio>
    </div>

    <!-- Bottom CTA (pinned to the bottom of the sheet) -->
    <div class="pd-cta-wrap">
      <button class="pd-cta" [disabled]="!hasQuestions" (click)="goToQuestions()">
        <span *ngIf="hasQuestions && !checkProgress()">Answer story questions</span>
        <span *ngIf="hasQuestions && checkProgress()">Edit story questions</span>
        <span *ngIf="!hasQuestions">No questions for this story</span>
        <ion-icon *ngIf="hasQuestions" name="arrow-forward-outline"></ion-icon>
      </button>
    </div>

  </div>
</ion-content>

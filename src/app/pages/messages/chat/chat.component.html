<ion-content [fullscreen]="true" class="page-content chat-page" #content>
  <div class="chat-thread-wrapper">
    <!-- Group Management Action (Top) -->
    <div class="group-management-bar" *ngIf="chat?.type === 'group'">
      <span class="group-label">Group Chat</span>
      <button class="add-member-pill-btn" (click)="addMember()">
        <ion-icon name="person-add-outline"></ion-icon>
        <span>Add Member</span>
      </button>
    </div>
    <ng-container *ngFor="let msg of chat?.messages; index as index; trackBy: trackByCreated">
      <!-- Date Divider -->
      <div class="date-divider" *ngIf="isDifferentDay(index)">
        <span class="date-pill">{{ msg?.createdAt | date : 'EEEE' | uppercase }}</span>
      </div>

      <!-- Message Structure -->
      <div class="message-row" [class.sender]="msg.uid === currentUser?.uid" [class.recipient]="msg.uid !== currentUser?.uid">
        
        <!-- Recipient Avatar -->
        <div class="message-meta-avatar" *ngIf="msg.uid !== currentUser?.uid">
          <div class="avatar-circle">
            <span *ngIf="!msg.user?.photoURL">{{ (msg.user?.displayName || 'C') | slice:0:1 }}</span>
            <img [src]="msg.user?.photoURL" *ngIf="msg.user?.photoURL" />
          </div>
        </div>

        <!-- Bubble Container -->
        <div class="bubble-container">
          <div class="message-bubble" [class.media]="msg.type === 'image' || msg.type === 'voice'">
            <!-- Reaction Button (Hover/Options) -->
            <div class="message-actions-overlay">
              <button class="reaction-trigger" (click)="openReactionPicker($event, msg)">
                <ion-icon name="happy-outline"></ion-icon>
              </button>
              <button class="options-trigger" (click)="presentMessageOptions($event, msg)">
                <ion-icon name="ellipsis-vertical"></ion-icon>
              </button>
            </div>

            <!-- Text Bubble -->
            <div class="bubble" *ngIf="msg?.type === 'text' || !msg?.type">
              <p>{{ msg?.content || msg?.message }}</p>
            </div>

            <!-- Image Bubble -->
            <div class="bubble image-bubble" *ngIf="msg?.type === 'image'">
              <img [src]="msg.content" />
            </div>

            <!-- Audio Bubble -->
            <div class="bubble audio-bubble" *ngIf="msg?.type === 'audio'">
              <app-voice-note [url]="msg.content" [isSender]="msg.uid === currentUser?.uid"></app-voice-note>
            </div>

            <!-- Reactions Display -->
            <div class="message-reactions" *ngIf="msg.reactions?.length">
              <div class="reaction-pill" *ngFor="let group of getReactionGroups(msg.reactions)">
                <span class="emoji">{{ group.emoji }}</span>
                <span class="count" *ngIf="group.count > 1">{{ group.count }}</span>
              </div>
            </div>
          </div>

          <!-- Timestamp Below -->
          <span class="message-timestamp">{{ msg?.createdAt | date : 'hh:mm a' }}</span>
        </div>
      </div>
    </ng-container>
  </div>

</ion-content>

<div class="chat-footer">
  <div class="chat-footer-wrapper">
    <input type="file" id="chat-file-input" style="display: none" (change)="onFileSelected($event)" accept="image/*" />
    <div class="footer-actions-left" *ngIf="!recording">
      <button class="icon-btn" (click)="presentAttachmentOptions()"><ion-icon name="add-circle-outline"></ion-icon></button>
    </div>
    
    <div class="input-container" *ngIf="!recording">
      <input type="text" placeholder="Type your message..." [(ngModel)]="newMsg" (keydown.enter)="submit(chat)" />
      <button class="emoji-btn" (click)="openEmojiPicker($event)"><ion-icon name="happy-outline"></ion-icon></button>
    </div>

    <!-- WhatsApp-style Recording Overlay -->
    <div class="recording-overlay" *ngIf="recording">
      <div class="recording-indicators">
        <div class="pulse-dot"></div>
        <span class="status-label">Recording...</span>
        <span class="timer">{{ durationDisplay || '0:00' }}</span>
      </div>
      <div class="slide-to-cancel" (click)="cancelRecording()">
        <ion-icon name="chevron-back-outline"></ion-icon>
        <span>Swipe or tap to cancel</span>
      </div>
    </div>

    <div class="footer-actions-right">
      <!-- Show Send button ONLY when there is text -->
      <button class="send-btn" (click)="submit(chat)" *ngIf="!recording && newMsg?.trim()?.length > 0">
        <ion-icon name="send-sharp"></ion-icon>
      </button>

      <!-- Show Mic button ONLY when there is NO text -->
      <button 
        class="mic-btn" 
        #recordBtn
        *ngIf="(!newMsg || newMsg?.trim()?.length === 0) || recording"
        [class.recording]="recording"
        (touchstart)="startRecording()" 
        (touchend)="stopRecording()"
        (mousedown)="startRecording()"
        (mouseup)="stopRecording()"
        (mouseleave)="stopRecording()"
      >
        <ion-icon [name]="recording ? 'mic' : 'mic-outline'"></ion-icon>
      </button>
    </div>
  </div>
</div>

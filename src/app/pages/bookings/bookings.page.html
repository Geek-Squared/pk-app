<ion-content [fullscreen]="true" class="page-content booking-content">
  <!-- One responsive layout. This page previously carried two complete copies of
       the same form — a mobile ion-card block and a separate .desktop-content
       block — both bound to the same FormGroup. -->
  <div class="booking-shell">

    <header class="booking-header">
      <span class="overline">Support</span>
      <h1>Book a session</h1>
      <p>Tell us how to reach you and a counsellor will confirm a time.</p>
    </header>

    <form [formGroup]="bookingsForm" class="pk-form-card pk-form">

      <div class="pk-field">
        <label for="bk-name">Full name</label>
        <input id="bk-name" class="pk-input" type="text" formControlName="fullName"
               autocomplete="name" placeholder="Your name" />
      </div>

      <div class="pk-field">
        <label for="bk-phone">Phone number</label>
        <input id="bk-phone" class="pk-input" type="tel" formControlName="phoneNumber"
               autocomplete="tel" inputmode="tel" placeholder="077 123 4567" />
        <p class="pk-hint">We will call or message this number.</p>
      </div>

      <div class="pk-field">
        <label for="bk-email">Email address</label>
        <input id="bk-email" class="pk-input" type="email" formControlName="email"
               autocomplete="email" inputmode="email" placeholder="you@example.com" />
      </div>

      <div class="pk-field">
        <label for="bk-date">Preferred date</label>
        <input id="bk-date" class="pk-input" type="date" formControlName="bookingDate" />
      </div>

      <div class="pk-field">
        <label for="bk-message">Anything we should know? <span class="pk-optional">Optional</span></label>
        <textarea id="bk-message" class="pk-textarea" rows="3" formControlName="message"
                  placeholder="You do not have to explain anything you would rather say in person."></textarea>
      </div>

    </form>

    <!-- Someone booking a counselling session is a plausible person to be in
         distress. Every other support surface offers a route to a human; this
         one did not. -->
    <button type="button" class="crisis" (click)="talkToSomeone()">
      <span class="crisis-icon">
        <ion-icon name="call"></ion-icon>
      </span>
      <span class="crisis-text">
        <b>Need to talk now?</b>
        <span>Reach a counsellor straight away</span>
      </span>
      <ion-icon class="crisis-caret" name="chevron-forward"></ion-icon>
    </button>

  </div>

  <div class="booking-foot">
    <button type="button" class="pk-submit" (click)="onSubmit()" [disabled]="bookingsForm.invalid">
      Request this session
    </button>
    <p class="foot-note">We usually confirm within one working day.</p>
  </div>
</ion-content>

<ion-content [fullscreen]="true" class="page-content feedback-content-page">
  <!-- One responsive layout. This page carried two complete copies of the same
       form — a mobile ion-card block and a .desktop-content block — both bound
       to the same FormGroup. -->
  <div class="feedback-shell">

    <header class="feedback-header">
      <span class="overline">Your voice</span>
      <h1>Get in touch</h1>
      <p>Tell us what is working and what is not. It goes straight to the programme team.</p>
    </header>

    <form [formGroup]="feedbackForm" class="pk-form-card pk-form">

      <div class="pk-field">
        <label for="fb-name">Your name <span class="pk-optional">Optional</span></label>
        <input id="fb-name" class="pk-input" type="text" formControlName="name"
               autocomplete="name" placeholder="Leave blank to stay anonymous" />
      </div>

      <div class="pk-field">
        <label for="fb-phone">Phone number <span class="pk-optional">Optional</span></label>
        <input id="fb-phone" class="pk-input" type="tel" formControlName="phoneNumber"
               autocomplete="tel" inputmode="tel" placeholder="Only if you would like a reply" />
      </div>

      <div class="pk-field">
        <label for="fb-message">Your message</label>
        <textarea id="fb-message" class="pk-textarea feedback-message" rows="5"
                  formControlName="message"
                  placeholder="What would you like us to know?"></textarea>
      </div>

    </form>

  </div>

  <div class="feedback-foot">
    <button type="button" class="pk-submit" (click)="onSubmit()" [disabled]="feedbackForm.invalid">
      Send feedback
    </button>
    <p class="foot-note">Only your message is required.</p>
  </div>
</ion-content>
